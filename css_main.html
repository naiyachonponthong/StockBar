<style>
/* ============================================================
   SECTION 1 — COLOR STRATEGY
   ธีม: คลังสินค้าตอนเช้า (concrete + steel blue + amber lamp)
   ============================================================ */
:root{
  --ink:          oklch(0.26 0.022 250);
  --ink-soft:     oklch(0.46 0.020 250);
  --ink-faint:    oklch(0.62 0.016 250);

  --paper:        oklch(0.985 0.004 250);
  --surface:      oklch(1 0 0);
  --surface-2:    oklch(0.966 0.006 250);
  --line:         oklch(0.905 0.008 250);
  --line-soft:    oklch(0.945 0.006 250);

  --brand:        oklch(0.46 0.095 248);
  --brand-deep:   oklch(0.36 0.085 250);
  --brand-tint:   oklch(0.945 0.022 248);

  --amber:        oklch(0.74 0.145 68);
  --amber-tint:   oklch(0.958 0.036 76);
  --green:        oklch(0.60 0.115 155);
  --green-tint:   oklch(0.950 0.035 155);
  --red:          oklch(0.56 0.165 27);
  --red-tint:     oklch(0.952 0.032 27);

  --radius:  10px;
  --radius-s: 7px;
  --shadow:  0 1px 2px oklch(0.26 0.022 250 / .06), 0 4px 14px oklch(0.26 0.022 250 / .05);
  --sidebar-w: 254px;
  --topbar-h: 58px;

  --bs-primary: var(--brand);
  --bs-body-color: var(--ink);
  --bs-border-color: var(--line);
}

/* ============================================================
   SECTION 2 — BASE
   ============================================================ */
*{ -webkit-tap-highlight-color: transparent; }
body{
  font-family:'IBM Plex Sans Thai', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 14.5px;
  margin:0;
}
.mono, .num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
a{ text-decoration:none; }
h1,h2,h3,h4,h5{ font-weight:600; letter-spacing:-.01em; }

/* ============================================================
   SECTION 3 — LOGIN
   ============================================================ */
.login-wrap{
  min-height:100vh;
  background:
    radial-gradient(1100px 520px at 15% -10%, oklch(0.93 0.035 248) 0%, transparent 62%),
    var(--paper);
  padding:24px;
  display:grid; place-items:center;
}
.login-card{
  width:100%; max-width:400px; background:var(--surface);
  border:1px solid var(--line); border-radius:14px;
  padding:30px 28px 26px; box-shadow:var(--shadow);
}
.login-brand{ display:flex; gap:13px; align-items:center; margin-bottom:24px; }
.login-mark{
  width:46px;height:46px;border-radius:11px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:22px;flex:none;
}
.login-title{ font-size:20px; font-weight:700; line-height:1.15; }
.login-sub{ font-size:12px; color:var(--ink-faint); }
.login-msg{ margin-top:12px; font-size:13px; color:var(--red); min-height:20px; text-align:center; }
.login-hint{ margin-top:6px; text-align:center; font-size:12px; color:var(--ink-faint); }

/* ============================================================
   SECTION 4 — SHELL  (fixed sidebar + margin-left content)
   ห้ามใช้ display:flex บน wrapper และห้ามใส่ width:100% ที่ .content
   ============================================================ */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w);
  background:var(--surface); border-right:1px solid var(--line);
  overflow-y:auto; z-index:1040; transition:transform .22s ease;
}
.brand{ display:flex; gap:11px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line-soft); }
.brand-mark{
  width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:18px;flex:none;
}
.brand-name{ font-weight:700; font-size:15.5px; line-height:1.2; }
.brand-org{ font-size:11.5px; color:var(--ink-faint); line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }
.menu{ padding:8px 10px 16px; }
.menu-label{
  font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-faint); padding:14px 10px 6px;
}
.menu a{
  display:flex; align-items:center; gap:10px;
  padding:8px 11px; margin-bottom:1px; border-radius:var(--radius-s);
  color:var(--ink-soft); font-size:14px; line-height:1.35;
}
.menu a i{ font-size:15px; width:19px; text-align:center; color:var(--ink-faint); }
.menu a:hover{ background:var(--surface-2); color:var(--ink); }
.menu a.active{ background:var(--brand-tint); color:var(--brand-deep); font-weight:600; }
.menu a.active i{ color:var(--brand); }
.sidebar-foot{ padding:10px 18px 18px; font-size:11px; color:var(--ink-faint); }

.topbar{
  position:fixed; top:0; left:var(--sidebar-w); right:0; height:var(--topbar-h);
  background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:0 18px; z-index:1030;
}
.topbar-title{ font-weight:600; font-size:16px; }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.btn-ghost{ background:transparent; border:none; color:var(--ink-soft); }
.btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }
.scan-status{
  font-size:12px; padding:4px 10px; border-radius:20px;
  background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--line-soft);
}
.scan-status.armed{ background:var(--green-tint); color:oklch(0.42 0.10 155); border-color:transparent; }

.content{
  margin-left:var(--sidebar-w);
  padding-top:var(--topbar-h);
  box-sizing:border-box;
  min-height:100vh;
}
.page{ padding:22px 24px 60px; }
.sidebar-backdrop{ display:none; position:fixed; inset:0; background:oklch(0.26 0.02 250/.45); z-index:1035; }

@media (max-width: 991.98px){
  .sidebar{ transform:translateX(-100%); }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-backdrop.show{ display:block; }
  .topbar{ left:0; }
  .content{ margin-left:0; }
  .page{ padding:16px 14px 60px; }
}

/* ============================================================
   SECTION 5 — CARDS / TABLES / FORMS
   ============================================================ */
.card-x{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px;
}
.card-x-head{
  padding:13px 16px; border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.card-x-head h6{ margin:0; font-size:14.5px; font-weight:600; }
.card-x-head .spacer{ margin-left:auto; }
.card-x-body{ padding:16px; }
.card-x-body.tight{ padding:0; }

.stat-strip{ display:grid; gap:12px; grid-template-columns: 1.4fr 1fr 1fr 1fr; margin-bottom:18px; }
@media (max-width: 991.98px){ .stat-strip{ grid-template-columns:1fr 1fr; } }
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow);
}
.stat.lead{ background:var(--brand-deep); border-color:transparent; color:#fff; }
.stat.lead .stat-label{ color:oklch(0.86 0.02 248); }
.stat-label{ font-size:12px; color:var(--ink-faint); margin-bottom:5px; }
.stat-value{ font-size:22px; font-weight:700; font-family:'IBM Plex Mono',monospace; letter-spacing:-.02em; }
.stat.lead .stat-value{ font-size:26px; }
.stat-note{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }
.stat.warn{ background:var(--amber-tint); border-color:transparent; }
.stat.warn .stat-value{ color:oklch(0.48 0.12 62); }

.table-x{ width:100%; margin:0; font-size:13.6px; }
.table-x thead th{
  background:var(--surface-2); color:var(--ink-soft);
  font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
.table-x tbody td{ padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
.table-x tbody tr:hover{ background:var(--surface-2); }
.table-wrap{ overflow-x:auto; }
.t-main{ font-weight:600; line-height:1.25; }
.t-sub{ font-size:11.5px; color:var(--ink-faint); line-height:1.3; }
.text-num{ text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }

.badge-x{ display:inline-block; padding:2.5px 8px; border-radius:20px; font-size:11.5px; font-weight:600; }
.b-in{ background:var(--green-tint); color:oklch(0.42 0.10 155); }
.b-out{ background:var(--red-tint); color:oklch(0.44 0.13 27); }
.b-tr{ background:var(--brand-tint); color:var(--brand-deep); }
.b-ct{ background:var(--amber-tint); color:oklch(0.46 0.11 62); }
.b-muted{ background:var(--surface-2); color:var(--ink-faint); }

.form-label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
.form-control, .form-select{ border-color:var(--line); border-radius:var(--radius-s); font-size:14px; }
.form-control:focus, .form-select:focus{
  border-color:var(--brand); box-shadow:0 0 0 3px oklch(0.46 0.095 248 / .13);
}
.btn{ border-radius:var(--radius-s); font-size:14px; font-weight:500; }
.btn-primary{ background:var(--brand); border-color:var(--brand); }
.btn-primary:hover{ background:var(--brand-deep); border-color:var(--brand-deep); }
.btn-light{ background:var(--surface-2); border-color:var(--line); }
.btn-icon{ padding:3px 8px; font-size:13px; }

/* ============================================================
   SECTION 6 — SCAN BOX
   ============================================================ */
.scan-panel{
  background:var(--brand-deep); border-radius:var(--radius); padding:16px;
  margin-bottom:16px; color:#fff;
}
.scan-panel .scan-title{ font-size:12px; color:oklch(0.85 0.02 248); margin-bottom:7px; }
.scan-input{
  font-size:20px !important; font-family:'IBM Plex Mono',monospace;
  padding:11px 14px !important; border:2px solid transparent !important; border-radius:var(--radius-s);
}
.scan-input:focus{ border-color:var(--amber) !important; box-shadow:0 0 0 4px oklch(0.74 0.145 68 / .25) !important; }
.scan-hint{ font-size:11.5px; color:oklch(0.80 0.02 248); margin-top:7px; }
.scan-modes{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
.scan-modes button{
  font-size:12px; padding:4px 11px; border-radius:20px; border:1px solid oklch(0.62 0.05 248);
  background:transparent; color:oklch(0.88 0.02 248);
}
.scan-modes button.on{ background:var(--amber); border-color:var(--amber); color:oklch(0.25 0.06 60); font-weight:600; }

.cart-empty{ padding:34px 16px; text-align:center; color:var(--ink-faint); font-size:13.5px; }
.qty-input{ width:88px; text-align:right; font-family:'IBM Plex Mono',monospace; }
.cost-input{ width:104px; text-align:right; font-family:'IBM Plex Mono',monospace; }
tr.flash-row{ animation: flashrow .7s ease; }
@keyframes flashrow{ 0%{ background:var(--amber-tint);} 100%{ background:transparent;} }

.total-bar{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:13px 16px; background:var(--surface-2); border-top:1px solid var(--line);
}
.total-bar .tb-label{ font-size:12px; color:var(--ink-faint); }
.total-bar .tb-value{ font-size:19px; font-weight:700; font-family:'IBM Plex Mono',monospace; }

/* ============================================================
   SECTION 7 — MISC
   ============================================================ */
.toast-stack{ position:fixed; right:16px; bottom:16px; z-index:2000; display:grid; gap:8px; }
.toast-x{
  background:var(--ink); color:#fff; padding:11px 15px; border-radius:var(--radius-s);
  font-size:13.5px; max-width:340px; box-shadow:0 6px 22px oklch(0.26 0.02 250/.28);
}
.toast-x.ok{ background:oklch(0.40 0.10 155); }
.toast-x.bad{ background:oklch(0.44 0.15 27); }
.busy-overlay{
  display:none; position:fixed; inset:0; background:oklch(0.26 0.02 250/.32); z-index:2100;
  place-items:center;
}
.busy-overlay.show{ display:grid; }
.page-loading{ padding:80px; text-align:center; }
.confirm-icon{ font-size:34px; color:var(--amber); line-height:1; }
.empty-state{ padding:44px 20px; text-align:center; color:var(--ink-faint); }
.empty-state i{ font-size:32px; opacity:.5; display:block; margin-bottom:10px; }
.search-list{
  max-height:230px; overflow-y:auto; border:1px solid var(--line);
  border-radius:var(--radius-s); margin-top:5px; background:var(--surface);
}
.search-list .si{ padding:8px 12px; border-bottom:1px solid var(--line-soft); cursor:pointer; }
.search-list .si:hover{ background:var(--brand-tint); }
.search-list .si:last-child{ border-bottom:none; }
.filter-row{ display:flex; gap:9px; flex-wrap:wrap; align-items:flex-end; }
.filter-row .fi{ min-width:150px; }
.mini-bar{ height:7px; border-radius:5px; background:var(--line-soft); overflow:hidden; }
.mini-bar > span{ display:block; height:100%; background:var(--brand); }
.mini-bar.low > span{ background:var(--red); }

.label-sheet{ display:flex; flex-wrap:wrap; gap:4mm; }
.label-item{
  border:1px dashed var(--line); border-radius:4px; padding:3mm;
  text-align:center; background:#fff;
}
.label-item .lb-name{ font-size:10px; line-height:1.2; margin-bottom:1mm;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media print{
  .sidebar,.topbar,.sidebar-backdrop,.no-print{ display:none !important; }
  .content{ margin-left:0 !important; padding-top:0 !important; }
  .page{ padding:0 !important; }
  .card-x{ border:none; box-shadow:none; }
  .label-item{ border:none; }
  body{ background:#fff; }
}
</style>
